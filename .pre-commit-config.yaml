repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: branding-check
        name: branding check
        entry: ./scripts/check_branding.sh
        language: system
        pass_filenames: false
        always_run: true
