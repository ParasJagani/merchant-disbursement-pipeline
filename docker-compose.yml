# Single-node Redpanda broker: Kafka-API compatible, no ZooKeeper, starts in seconds.
# To use a managed cluster instead, point KAFKA_BOOTSTRAP_SERVERS at it; the
# generator and file writer only speak the standard Kafka protocol.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: mdp-kafka
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: mdp-console
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
