name: ci
# Free: no Snowflake account is touched. The Snowflake run is the separate "integration" workflow.
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest duckdb dbt-core dbt-duckdb streamlit reportlab pypdf
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - name: Branding check
        env:
          BRANDING_DENYLIST: ${{ secrets.BRANDING_DENYLIST }}
        run: ./scripts/check_branding.sh
      # The whole pipeline, offline: golden data -> silver on DuckDB -> gold with dbt -> PDFs read
      # back and compared with gold and the answer key.
      - name: Golden dataset
        run: python -m generator backfill --out data/golden
      - name: Silver and gold on DuckDB (dbt build)
        run: make dbt-local
      - name: Statements equal gold
        run: make statements-verify
      - name: dbt docs
        run: DBT_DUCKDB_PATH=dbt/target/local.duckdb dbt docs generate --project-dir dbt --profiles-dir dbt --target duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json
